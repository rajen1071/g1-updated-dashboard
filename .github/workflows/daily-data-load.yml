# Loads new data from Mautic into the dashboard every day at 3 AM Pacific time, so it is ready when people open it.
# GitHub schedules use UTC, so the job is scheduled for 3 AM PDT (10:05 UTC) and 3 AM PST (11:05 UTC);
# the script only runs when it is 3 AM in Los Angeles. "Run workflow" on the Actions tab runs it at any time.
# Needs the repository variable DASHBOARD_URL (Settings > Secrets and variables > Actions > Variables).
name: Daily data load (3 AM Pacific)

on:
  schedule:
    - cron: "5 10 * * *"
    - cron: "5 11 * * *"
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/warm.ts
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          ONLY_AT_PACIFIC_HOUR: ${{ github.event_name == 'schedule' && '3' || '' }}
